# Configuration for Cloudflare Pages with Next-on-Pages / D1 Database
name = "gestorcoop"
compatibility_date = "2026-09-10"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Workers AI. Habilitado mas ainda não é o provedor primário: a ordem da cascata
# vive em `IA_ORDEM_TRANSCRICAO` e começa pela OpenAI, que é o caminho validado.
# Depois de comparar a qualidade com áudio clínico real, inverta a env para
# `workersai,groq,openai` — o custo cai para dentro da cota gratuita sem deploy.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "gestorcoop-db"
# UUID real do banco. Precisa ser válido mesmo em desenvolvimento: o publish
# recusa qualquer outra coisa ("Error 8000022: Invalid database UUID"). Para
# rodar contra o sqlite local, use `wrangler dev --local` em vez de trocar o id.
database_id = "ab487796-11d9-4f62-8aff-3df7843ce394"
migrations_dir = "migrations"
